name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # OpenSeesPy's Linux wheel (openseespylinux 3.8.0.0) requires Python >= 3.12,
        # so CI must use 3.12 (matches the local .venv at 3.12.15). 3.11 cannot
        # satisfy the openseespy>=3.8 dependency on Linux.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: pip install -e .

      - name: Run tests
        # Runs fast unit, constitutive, static/seismic, surrogate and Day 4
        # JSON-schema checks. The slow full 80-design regeneration is not
        # exercised by any test, so it is implicitly skipped.
        run: pytest -q
