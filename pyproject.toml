[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diagrid_opt"
version = "0.1.0"
description = "Parametric diagrid canopy geometry and superelastic NiTi constitutive verification"
requires-python = ">=3.10,<3.15"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pytest>=7",
    "openseespy>=3.8",
    "scikit-learn",
    "pymoo",
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
